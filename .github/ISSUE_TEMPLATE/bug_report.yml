name: Bug report
description: Something in the Terraform, modules, or CI isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not include secrets or real subscription/tenant/client IDs** —
        redact them. For security vulnerabilities, use the [Security policy](../security/policy) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error output (redacted).
      placeholder: e.g. `terraform validate` fails in landing-zones/avd-workload with ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cd ...
        2. terraform init -backend=false
        3. terraform validate
    validations:
      required: true
  - type: input
    id: tf-version
    attributes:
      label: Terraform version
      placeholder: e.g. 1.15.6
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Affected root / module
      placeholder: e.g. bootstrap/, landing-zones/avd-workload, modules/...
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have removed all secrets and real subscription/tenant/client IDs from this report
          required: true
