# Keep GitHub Actions and Terraform providers/modules current + patched.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["dependencies", "ci"]

  - package-ecosystem: terraform
    directory: /bootstrap
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: ["dependencies", "terraform"]

  - package-ecosystem: terraform
    directory: /landing-zones/avd-workload
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: ["dependencies", "terraform"]
